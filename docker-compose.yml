services:
  backend:
    build:
      context: ./BackPrueba
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    volumes:
      - ./BackPrueba:/app
    environment:
      - FLASK_ENV=development

  frontend:
    build:
      context: ./FrontPrueba
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./FrontPrueba:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend_data: